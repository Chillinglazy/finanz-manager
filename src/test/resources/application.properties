# Tests laufen gegen eine In-Memory-H2-Datenbank im PostgreSQL-Modus, damit kein Docker nötig ist.
spring.datasource.url=jdbc:h2:mem:finanz;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=MONTH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
