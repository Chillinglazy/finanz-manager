<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrieren · Finanz-Manager</title>
  <meta name="description" content="Budgets, Kategorien und Ausgaben im Blick">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <main class="page narrow">
    <a href="/" class="brand" style="text-decoration: none"><span>€</span> Finanz-Manager</a>
    <h1>Registrieren</h1>
    <form id="auth-form" class="stack" data-mode="registrieren" novalidate>
      <label>E-Mail
        <input class="input" name="email" type="email" autocomplete="email" required>
      </label>
      <label>Passwort
        <input class="input" name="password" type="password" autocomplete="new-password" required minlength="8">
      </label>
      <p id="form-error" class="error hidden" role="alert"></p>
      <button type="submit" class="btn btn-primary">Konto erstellen</button>
    </form>
    <p class="small muted">Schon registriert? <a href="/login" class="link">Anmelden</a></p>
  </main>
</body>
</html>
