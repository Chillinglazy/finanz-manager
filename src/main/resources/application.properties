spring.application.name=finanz-manager

# Datenbank: Standardwerte passen zu docker-compose.yml, auf dem Server per Umgebungsvariablen setzen.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finanzmanager}
spring.datasource.username=${DB_USER:finanz}
spring.datasource.password=${DB_PASSWORD:finanz}

# Schema kommt ausschließlich aus Flyway (src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d
